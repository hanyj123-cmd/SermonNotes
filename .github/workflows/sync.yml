name: 설교 자막 정리 동기화

on:
  schedule:
    # 매일 11:00 UTC (토론토 오전 6~7시). 필요하면 바꾸세요.
    - cron: '0 11 * * *'
  workflow_dispatch:
    inputs:
      max_new:
        description: '이번 실행에서 정리할 최대 영상 수'
        required: false
        default: '5'

permissions:
  contents: write

concurrency:
  group: sermon-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 재생목록 확인 → 자막 수집 → Gemini 정리 → Sheets 저장 → JSON 내보내기
        env:
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          MAX_NEW_PER_RUN: ${{ github.event.inputs.max_new || vars.MAX_NEW_PER_RUN || '5' }}
        run: node scripts/sync.mjs

      - name: 변경된 데이터 커밋
        run: |
          git config user.name "sermon-notes-bot"
          git config user.email "sermon-notes-bot@users.noreply.github.com"
          git add docs/data/sermons.json
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "데이터 갱신: 설교 정리 업데이트"
            git push
          fi
