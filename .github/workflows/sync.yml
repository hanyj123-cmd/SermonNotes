name: 설교 정리 · 오늘의 말씀 동기화

on:
  schedule:
    # GitHub 예약은 UTC만 지원하고 토론토는 서머타임이 있어서, 여름용·겨울용 두 개씩 등록하고
    # 아래 gate 작업이 "지금이 정해진 토론토 시각인지" 보고 맞는 쪽만 실행하게 합니다.
    - cron: '0 2 * * 1' # 주일예배 일요일 22:00 (여름 EDT, UTC로는 월요일 02:00)
    - cron: '0 3 * * 1' # 주일예배 일요일 22:00 (겨울 EST)
    - cron: '0 8 * * *' # 오늘의 말씀 매일 04:00 (여름 EDT)
    - cron: '0 9 * * *' # 오늘의 말씀 매일 04:00 (겨울 EST)
  workflow_dispatch:
    inputs:
      max_new:
        description: '이번 실행에서 정리할 최대 영상 수'
        required: false
        default: '5'
      categories:
        description: '확인할 구분 (쉼표로: sunday,dawn,wednesday,youth / all = 전부 / daily = 오늘의 말씀만, 비우면 주일예배만)'
        required: false
        default: ''
      export_only:
        description: '새로 정리하지 않고 시트의 현재 내용을 사이트에 반영만 하기 (제목·설교자 수정 후 사용, true/false)'
        required: false
        default: 'false'
      bible_check:
        description: '성경 본문 가져오기 점검만 하기 (true/false)'
        required: false
        default: 'false'
      daily_dates:
        description: '오늘의 말씀을 만들 날짜 (쉼표로, 예: 2026-10-08,2026-10-09 — 비우면 오늘·내일)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: sermon-sync
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.gate.outputs.run }}
      categories: ${{ steps.gate.outputs.categories }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: gate
        run: node scripts/gate.mjs

  sync:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 성경 본문 가져오기 점검 (점검만 선택했을 때)
        if: github.event.inputs.bible_check == 'true'
        run: node scripts/bible-check.mjs

      - name: 재생목록 확인 → 자막 수집 → Gemini 정리 → Sheets 저장 → JSON 내보내기
        if: github.event.inputs.bible_check != 'true'
        env:
          ONLY_CATEGORIES: ${{ github.event.inputs.categories || needs.gate.outputs.categories }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          SUPADATA_API_KEY: ${{ secrets.SUPADATA_API_KEY }}
          GEMINI_VIDEO: ${{ vars.GEMINI_VIDEO }}
          AUTO_WITHIN_DAYS: ${{ vars.AUTO_WITHIN_DAYS }}
          RETRY_DAYS: ${{ vars.RETRY_DAYS }}
          MAX_NEW_PER_RUN: ${{ github.event.inputs.max_new || vars.MAX_NEW_PER_RUN || '5' }}
          DAILY_DATES: ${{ github.event.inputs.daily_dates }}
        run: node scripts/sync.mjs ${{ github.event.inputs.export_only == 'true' && '--export-only' || '' }}

      - name: 변경된 데이터 커밋
        run: |
          git config user.name "sermon-notes-bot"
          git config user.email "sermon-notes-bot@users.noreply.github.com"
          git add -A docs/data
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "데이터 갱신: 설교 정리 · 오늘의 말씀"
            # 동기화가 도는 사이 main 에 다른 변경이 올라왔을 수 있으므로, 최신 내용 위에 다시 얹어서 올립니다 (최대 5번 시도)
            for i in 1 2 3 4 5; do
              git pull --rebase -X theirs origin "${GITHUB_REF_NAME}" && git push && exit 0
              echo "push 재시도 ${i}/5"
              git rebase --abort 2>/dev/null || true
              sleep $((i * 3))
            done
            echo "::error::데이터를 저장소에 올리지 못했습니다. 잠시 뒤 지금 동기화를 다시 눌러 주세요."
            exit 1
          fi
